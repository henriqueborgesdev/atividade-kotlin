# Opções de JVM usadas pelo daemon do Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Usa APKs específicos por ABI ao gerar o build durante o desenvolvimento.
android.useAndroidX=true

# Habilita o cache de configuração do Gradle para builds mais rápidos.
org.gradle.configuration-cache=true

# Estilo de código Kotlin oficial.
kotlin.code.style=official

# Desabilita o R class não transitivo apenas se necessário; por padrão já habilitado no AGP atual.
android.nonTransitiveRClass=true
